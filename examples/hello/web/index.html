<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>xgoef hello</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1a1f16;
        --paper: #f3efe6;
        --accent: #2f6f4e;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, #d9e7dd 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #efe6d4 0%, transparent 50%),
          var(--paper);
        color: var(--ink);
        display: grid;
        place-items: center;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-weight: 600;
        letter-spacing: 0.04em;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        opacity: 0.8;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #f7fff9;
        padding: 0.55rem 1.1rem;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: var(--accent);
      }
      #out,
      #evt {
        margin-top: 0.75rem;
        min-height: 1.5em;
      }
      #evt {
        opacity: 0.75;
        font-size: 0.95em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>xgoef</h1>
      <p>XGo · LLGo · CEF — Tauri-shaped desktop shell</p>
      <div class="actions">
        <button id="btn" type="button">invoke greet</button>
        <button id="btn-aux" class="secondary" type="button">open aux</button>
        <button id="btn-fs" class="secondary" type="button">read note</button>
        <button id="btn-os" class="secondary" type="button">os platform</button>
        <button id="btn-clip" class="secondary" type="button">clipboard</button>
        <button id="btn-ch" class="secondary" type="button">channel</button>
        <button id="btn-menu" class="secondary" type="button">menu</button>
        <button id="btn-tray" class="secondary" type="button">tray</button>
        <button id="btn-wait" class="secondary" type="button">wait</button>
        <button id="btn-cancel" class="secondary" type="button">cancel wait</button>
        <button id="btn-exit" class="secondary" type="button">exit</button>
        <button id="btn-relaunch" class="secondary" type="button">relaunch</button>
        <button id="btn-notify" class="secondary" type="button">notify</button>
        <button id="btn-shortcut" class="secondary" type="button">shortcut</button>
        <button id="btn-monitor" class="secondary" type="button">monitors</button>
        <button id="btn-print" class="secondary" type="button">print</button>
        <button id="btn-devtools" class="secondary" type="button">devtools</button>
        <button id="btn-injected" class="secondary" type="button">injected</button>
        <button id="btn-eval" class="secondary" type="button">eval</button>
        <button id="btn-autostart" class="secondary" type="button">autostart</button>
      </div>
      <div id="out">waiting for host</div>
      <div id="evt">event: —</div>
    </main>
    <script>
      const out = document.getElementById("out");
      const evt = document.getElementById("evt");
      function show(err) {
        const code = err && err.code ? err.code + ": " : "";
        const message = err && err.message ? err.message : String(err);
        out.textContent = code + message;
      }
      window.__XGOEF__.listen("tick", function (payload) {
        evt.textContent = "event: tick " + JSON.stringify(payload);
      });
      window.__XGOEF__.listen("menu", function (payload) {
        evt.textContent = "menu: " + JSON.stringify(payload);
      });
      window.__XGOEF__.listen("tray", function (payload) {
        evt.textContent = "tray: " + JSON.stringify(payload);
      });
      window.__XGOEF__.listen("global-shortcut", function (payload) {
        evt.textContent = "shortcut: " + JSON.stringify(payload);
      });
      document.getElementById("btn").onclick = async () => {
        try {
          const msg = await window.__XGOEF__.invoke("greet", { name: "xgo" });
          out.textContent = String(msg);
        } catch (e) {
          show(e);
        }
      };
      document.getElementById("btn-aux").onclick = async () => {
        try {
          const msg = await window.__XGOEF__.invoke("open_aux", {});
          out.textContent = String(msg);
        } catch (e) {
          show(e);
        }
      };
      document.getElementById("btn-fs").onclick = async () => {
        try {
          const text = await window.__XGOEF__.plugins.fs.readText("web/note.txt");
          out.textContent = String(text);
        } catch (e) {
          show(e);
        }
      };
      document.getElementById("btn-os").onclick = async () => {
        try {
          const plat = await window.__XGOEF__.plugins.os.platform();
          out.textContent = "platform: " + plat;
        } catch (e) {
          show(e);
        }
      };
      document.getElementById("btn-clip").onclick = async () => {
        try {
          await window.__XGOEF__.plugins.clipboard.writeText("from xgoef");
          out.textContent = await window.__XGOEF__.plugins.clipboard.readText();
        } catch (e) {
          show(e);
        }
      };
      document.getElementById("btn-ch").onclick = async () => {
        const ch = window.__XGOEF__.channel();
        const parts = [];
        ch.onmessage(function (payload) {
          parts.push(payload);
          evt.textContent = "channel: " + parts.join(" ");
        });
        try {
          out.textContent = String(await window.__XGOEF__.invoke("progress", { channel: ch }));
        } catch (e) {
          show(e);
        }
      };
      let waiting = null;
      document.getElementById("btn-wait").onclick = async () => {
        const job = window.__XGOEF__.invoke("wait", {}, { timeout: 2000 });
        waiting = job;
        try {
          out.textContent = String(await job);
        } catch (e) {
          show(e);
        }
      };
      document.getElementById("btn-cancel").onclick = () => {
        if (waiting && typeof waiting.cancel === "function") {
          waiting.cancel();
        }
      };
      document.getElementById("btn-menu").onclick = async () => {
        try {
          out.textContent = String(await window.__XGOEF__.invoke("menu:popup", {}));
        } catch (e) {
          show(e);
        }
      };
      document.getElementById("btn-exit").onclick = async () => {
        try {
          await window.__XGOEF__.plugins.process.exit(0);
        } catch (e) {
          show(e);
        }
      };
      document.getElementById("btn-notify").onclick = async () => {
        try {
          const perm = await window.__XGOEF__.plugins.notification.requestPermission();
          if (perm !== "granted") {
            out.textContent = String(perm);
            return;
          }
          await window.__XGOEF__.plugins.notification.show({ title: "xgoef", body: "hello" });
          out.textContent = "notified";
        } catch (e) {
          show(e);
        }
      };
      document.getElementById("btn-shortcut").onclick = async () => {
        try {
          const shortcut = window.__XGOEF__.plugins["global-shortcut"];
          const on = await shortcut.isRegistered("Control+Shift+X");
          if (!on) {
            await shortcut.register("Control+Shift+X");
          }
          out.textContent = "registered";
        } catch (e) {
          show(e);
        }
      };
      document.getElementById("btn-monitor").onclick = async () => {
        try {
          const list = await window.__XGOEF__.plugins.monitor.list();
          const scale = await window.__XGOEF__.plugins.monitor.scale();
          out.textContent = "displays: " + list.length + " scale " + scale;
        } catch (e) {
          show(e);
        }
      };
      document.getElementById("btn-print").onclick = async () => {
        try {
          await window.__XGOEF__.plugins.webview.print();
          out.textContent = "printing";
        } catch (e) {
          show(e);
        }
      };
      document.getElementById("btn-devtools").onclick = async () => {
        try {
          const view = window.__XGOEF__.plugins.webview;
          const open = await view.isDevToolsOpen();
          if (open) {
            await view.closeDevTools();
            out.textContent = "devtools closed";
          } else {
            await view.openDevTools();
            out.textContent = "devtools open";
          }
        } catch (e) {
          show(e);
        }
      };
      document.getElementById("btn-injected").onclick = () => {
        out.textContent = "injected: " + (window.__xgoefInjected || "missing");
      };
      document.getElementById("btn-eval").onclick = async () => {
        try {
          await window.__XGOEF__.plugins.eval.run("mark");
          out.textContent = "eval: mark";
        } catch (e) {
          show(e);
        }
      };
      document.getElementById("btn-autostart").onclick = async () => {
        try {
          const auto = window.__XGOEF__.plugins.autostart;
          const on = await auto.isEnabled();
          if (on) {
            await auto.disable();
            out.textContent = "autostart off";
          } else {
            await auto.enable();
            out.textContent = "autostart on";
          }
        } catch (e) {
          show(e);
        }
      };
      document.getElementById("btn-relaunch").onclick = async () => {
        try {
          await window.__XGOEF__.plugins.process.relaunch();
        } catch (e) {
          show(e);
        }
      };
      document.getElementById("btn-tray").onclick = async () => {
        try {
          out.textContent = String(await window.__XGOEF__.invoke("tray:popup", {}));
        } catch (e) {
          show(e);
        }
      };
    </script>
  </body>
</html>
